apiVersion: apps/v1
kind: Deployment
metadata:
  name: windowflow-controller
  namespace: windowflow-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: windowflow-controller
  template:
    metadata:
      labels:
        app: windowflow-controller
    spec:
      serviceAccountName: windowflow-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/iampengqian/windowflow-operator:v0.1.0
          imagePullPolicy: IfNotPresent
          args: [manager]
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
