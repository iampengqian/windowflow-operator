apiVersion: v1
kind: ServiceAccount
metadata:
  name: windowflow-controller
  namespace: windowflow-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: windowflow-controller
rules:
  - apiGroups: [data.windowflow.io]
    resources: [windowplans, windowleases]
    verbs: [get, list, watch]
  - apiGroups: [data.windowflow.io]
    resources: [windowplans/status]
    verbs: [get, patch, update]
  - apiGroups: [data.windowflow.io]
    resources: [windowplans/finalizers]
    verbs: [update]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: windowflow-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: windowflow-controller
subjects:
  - kind: ServiceAccount
    name: windowflow-controller
    namespace: windowflow-system
