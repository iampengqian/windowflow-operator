# Template: replace IDs, paths, sources, byte counts and image before applying.
# Experimental backend: requires CPFS >= 2.6 and an existing DataFlow.
apiVersion: data.windowflow.io/v1alpha1
kind: WindowPlan
metadata:
  name: cpfs-training
  namespace: default
spec:
  pvcName: training-cache
  backend: cpfs-dataflow
  slots: 2
  maxConcurrentLoads: 1
  # Example only. Budget logical bytes below actual available filesystem space.
  capacityBytes: 360000000000000
  jobTimeoutSeconds: 604800
  readers: [dp0, dp1]
  workerImage: ghcr.io/iampengqian/windowflow-operator:v0.1.0
  dataFlow:
    region: cn-wulanchabu
    fileSystemId: bmcpfs-REPLACE
    dataFlowId: df-REPLACE
    fileSystemPath: /dataflow-root/
    pvcPath: /dataflow-root/training-fileset/
    credentialsSecret: aliyun-dataflow
  windows:
    - id: window-0000
      source: windows/0000
      expectedBytes: 180000000000000
    - id: window-0001
      source: windows/0001
      expectedBytes: 180000000000000
    - id: window-0002
      source: windows/0002
      expectedBytes: 180000000000000
