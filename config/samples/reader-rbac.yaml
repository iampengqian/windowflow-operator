# Trusted training readers in one namespace share this role. It is not per-rank
# authentication: do not grant it to untrusted multi-tenant workloads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: windowflow-reader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: windowflow-reader
  namespace: default
rules:
  - apiGroups: [data.windowflow.io]
    resources: [windowplans]
    verbs: [get]
  - apiGroups: [data.windowflow.io]
    resources: [windowleases]
    verbs: [get, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: windowflow-reader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: windowflow-reader
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: windowflow-reader
