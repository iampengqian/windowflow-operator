[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "windowflow"
version = "0.1.0"
description = "Explicit window leases for WindowFlow Operator training readers"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "WindowFlow contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
kubernetes = ["kubernetes>=28"]

[project.urls]
Repository = "https://github.com/iampengqian/windowflow-operator"

[tool.setuptools.packages.find]
where = ["."]
include = ["windowflow*"]
