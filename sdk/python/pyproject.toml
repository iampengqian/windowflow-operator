[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "windowflow"
version = "0.2.0a1"
description = "Deterministic window schedules and training lifecycle for WindowFlow Operator"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "WindowFlow contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
kubernetes = ["kubernetes>=28"]
torch = ["torch>=2.2"]

[project.scripts]
windowflow-plan = "windowflow.plan_cli:main"

[project.urls]
Repository = "https://github.com/iampengqian/windowflow-operator"

[tool.setuptools.packages.find]
where = ["."]
include = ["windowflow*"]
